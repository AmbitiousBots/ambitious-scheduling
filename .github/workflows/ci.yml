name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-check:
    name: Verify the scheduling module
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - name: Check out the repository (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned tools (jdx/mise-action v5.3.0)
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78
        with:
          version: 2026.11.12
      - run: npm ci --strict-peer-deps
      - run: npm run release:check
      - run: npm audit

  debian-13:
    name: Debian 13, Node 24.22.3, no root
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container:
      image: debian:13
    steps:
      - name: Install what a fresh computer needs and create the user (the only steps run as root)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl xz-utils git
          useradd --create-home --shell /bin/bash box
      - name: Check out the repository (actions/checkout v7.0.1)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Hand the checkout to the user
        run: chown -R box:box "$GITHUB_WORKSPACE"
      - name: Install Node 24.22.3 under the user's home, then build, test and verify without root
        run: |
          runuser -u box -- bash -euo pipefail -c '
            cd "$GITHUB_WORKSPACE"
            export HOME=/home/box
            curl -fsSL https://nodejs.org/dist/v24.22.3/node-v24.22.3-linux-x64.tar.xz -o "$HOME/node.tar.xz"
            echo "4f2b175a6d53a5c617a80dba2676238a0688cef28c6da4eba35c7d844e66fcfb  $HOME/node.tar.xz" | sha256sum -c
            mkdir -p "$HOME/.local/node"
            tar -xJf "$HOME/node.tar.xz" -C "$HOME/.local/node" --strip-components=1
            export PATH="$HOME/.local/node/bin:$PATH"
            test "$(id -u)" != 0
            node --version
            node -p "process.versions.tz"
            npm ci
            npm run typecheck
            npm run lint
            npm run depcruise
            npm test
            npm run contract
            node verify/run --only build --only commands --only selfcheck --only calendars --only time-zones --only propose --only independent-check --only commit --only approval-flow --only constraint-model --only contract --only standalone
            npm run release:build
            export AMBITIOUS_HOME="$HOME/ambitious"
            mkdir -p "$AMBITIOUS_HOME/bin"
            cp release/ambitious-scheduling-0.1.2.mjs "$AMBITIOUS_HOME/bin/"
            ln -sf ambitious-scheduling-0.1.2.mjs "$AMBITIOUS_HOME/bin/ambitious-scheduling"
            cd "$HOME"
            node "$AMBITIOUS_HOME/bin/ambitious-scheduling" selfcheck
            node "$AMBITIOUS_HOME/bin/ambitious-scheduling" commands
            curl -fsSL https://github.com/AmbitiousBots/ambitious-tasks/releases/download/tasks-v0.1.4/ambitious-tasks-0.1.4.mjs -o "$HOME/ambitious-tasks-0.1.4.mjs"
            echo "e34df4d4bb277d154750a95776c2b0398cdbdfd2b52c24a9c6fe7e70873913a1  $HOME/ambitious-tasks-0.1.4.mjs" | sha256sum -c
            node "$GITHUB_WORKSPACE/examples/end-to-end/run.mjs" --tasks "$HOME/ambitious-tasks-0.1.4.mjs" --scheduling "$AMBITIOUS_HOME/bin/ambitious-scheduling-0.1.2.mjs"
          '
